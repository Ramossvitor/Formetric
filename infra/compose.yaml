name: formetric

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FORMETRIC_DB_NAME:-formetric}
      POSTGRES_USER: ${FORMETRIC_DB_USER:-formetric}
      POSTGRES_PASSWORD: ${FORMETRIC_DB_PASSWORD:-formetric_dev_only}
    ports:
      - "127.0.0.1:${FORMETRIC_DB_PORT:-5432}:5432"
    volumes:
      - formetric-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  formetric-postgres-data:
