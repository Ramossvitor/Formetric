name: formetric

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FORMETRIC_DB_NAME:-formetric}
      POSTGRES_USER: ${FORMETRIC_DB_USER:-formetric}
      POSTGRES_PASSWORD: ${FORMETRIC_DB_PASSWORD:-formetric_dev_only}
    ports:
      - "127.0.0.1:${FORMETRIC_DB_PORT:-5432}:5432"
    volumes:
      - formetric-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  formetric-postgres-data:
