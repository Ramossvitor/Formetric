spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_POOLER_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # O binding aqui é direto no HikariConfig, que só aceita long em milissegundos —
      # sufixos de duração ("10s") derrubam o contexto na inicialização.
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 120000
      max-lifetime: 1500000
  flyway:
    url: ${DB_DIRECT_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  session:
    timeout: 12h
  lifecycle:
    timeout-per-shutdown-phase: 8s

server:
  port: ${PORT}
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
      timeout: 12h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

formetric:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
