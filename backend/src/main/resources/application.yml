spring:
  application:
    name: formetric
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/formetric}
    username: ${DB_USERNAME:formetric}
    password: ${DB_PASSWORD:formetric_dev_only}
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  servlet:
    session:
      cookie:
        http-only: true
        name: FORMETRIC_SESSION
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30d
  tomcat:
    max-http-form-post-size: 2MB
    max-parameter-count: 1000
    max-part-count: 50
    max-part-header-size: 8KB
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

formetric:
  http:
    # JSON/API bodies may be lowered per deployment but never raised above 256 KiB.
    max-request-body-size: ${MAX_HTTP_REQUEST_BODY_SIZE:256KB}
  security:
    # Login throttling topology: Forwarded/XFF remain useful for URL reconstruction only.
    # They are never an identity signal. TRANSPORT_PEER unwraps framework decorators and may
    # intentionally collapse every Cloud Run request into its platform peer; the global bucket
    # is the fail-safe until a trusted edge and a verifiable proxy chain are provisioned.
    login-origin:
      strategy: TRANSPORT_PEER
    password-computation:
      max-concurrent: ${PASSWORD_COMPUTATION_MAX_CONCURRENT:2}
      acquire-timeout-ms: ${PASSWORD_COMPUTATION_ACQUIRE_TIMEOUT_MS:25}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Formetric Owner}
