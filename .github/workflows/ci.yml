name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B -ntp verify

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: |
          docker compose -f infra/compose.yaml config --quiet
          docker compose -f infra/compose.e2e.yaml config --quiet

  container-e2e:
    name: Integrated container E2E
    needs:
      - frontend
      - backend
      - infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      E2E_ADMIN_EMAIL: owner.e2e@example.test
      E2E_ADMIN_PASSWORD: Formetric-E2E-password-2026
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build integrated image
        id: build-image
        run: docker compose -f infra/compose.e2e.yaml build --pull app

      - name: Start E2E environment
        id: start-environment
        run: docker compose -f infra/compose.e2e.yaml up --detach postgres app

      - name: Wait for application readiness
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18080/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            if ! docker compose -f infra/compose.e2e.yaml ps --status running app | grep -q app; then
              docker compose -f infra/compose.e2e.yaml logs --no-color app
              exit 1
            fi
            sleep 2
          done
          docker compose -f infra/compose.e2e.yaml logs --no-color
          exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Scan integrated image
        if: always() && steps.build-image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: formetric:e2e
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Export verified integrated image
        if: success()
        shell: bash
        run: |
          archive="formetric-e2e-${GITHUB_SHA}.tar.gz"
          docker image inspect formetric:e2e --format '{{.Id}}' > "${archive}.image-id"
          docker image save formetric:e2e | gzip -1 > "$archive"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload verified integrated image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formetric-integrated-image-${{ github.sha }}
          path: |
            formetric-e2e-${{ github.sha }}.tar.gz
            formetric-e2e-${{ github.sha }}.tar.gz.image-id
            formetric-e2e-${{ github.sha }}.tar.gz.sha256
          compression-level: 0
          retention-days: 7

      - name: Upload scan to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Capture container logs
        if: always() && steps.build-image.outcome == 'success'
        shell: bash
        run: docker compose -f infra/compose.e2e.yaml logs --no-color > container-e2e.log || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            container-e2e.log
            frontend/playwright-report/
            frontend/test-results/
            trivy-results.sarif

      - name: Stop E2E environment
        if: always()
        run: docker compose -f infra/compose.e2e.yaml down --volumes --remove-orphans
